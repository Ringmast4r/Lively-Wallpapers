<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Grid Wallpaper</title>
  <link rel="stylesheet" href="grid-wallpaper.css">
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <button id="hamburger" type="button" aria-label="Open grid settings"
    aria-controls="panel" aria-expanded="false" title="Settings · drag to move">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <section id="panel" aria-labelledby="settings-heading" hidden inert>
    <header class="panel-header">
      <h1 id="settings-heading">Grid settings</h1>
      <button id="close-settings" type="button" aria-label="Close grid settings">✕</button>
    </header>
    <p id="save-status" class="hint" role="status"></p>
    <button id="expand-sections" class="subtle-button" type="button">Expand all sections</button>

    <details open>
      <summary>Motion</summary>
      <div id="motion-controls" class="section-content"></div>
    </details>
    <details>
      <summary>Individual dome sizes</summary>
      <div id="dome-controls" class="section-content"></div>
    </details>
    <details>
      <summary>Performance</summary>
      <div id="performance-controls" class="section-content">
        <p class="hint">A lower frame rate or larger grid spacing reduces rendering work. Freeze frame pauses motion.</p>
      </div>
    </details>
    <details>
      <summary>Presets</summary>
      <div class="section-content">
        <div id="preset-grid" class="preset-grid" aria-label="Color and motion presets"></div>
      </div>
    </details>
    <details>
      <summary>Appearance</summary>
      <div id="appearance-controls" class="section-content"></div>
    </details>

    <div class="actions">
      <button id="randomize" type="button">Randomize motion</button>
      <button id="reset" type="button">Reset all</button>
    </div>
    <p id="action-status" class="hint" role="status" aria-live="polite"></p>
  </section>

  <noscript><p class="startup-error">Grid Wallpaper needs JavaScript enabled to render and show settings.</p></noscript>
  <script src="grid-config.js"></script>
  <script src="grid-wallpaper.js"></script>
  <script src="grid-settings.js"></script>
</body>
</html>
