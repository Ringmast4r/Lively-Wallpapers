<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Net Works Numbers Station</title>
<style>html{background:#0a0a0a}</style>
</head>
<body>
<script src="nwlive.js"></script>
<script src="marks.js"></script>
<script>
/* Numbers Station: five-figure groups with a face in them, as a desktop wallpaper.
 * Copyright (c) 2026 Net Works Lab LLC. All rights reserved. See LICENSE.txt.
 *
 * A page of five-figure groups, the traffic a numbers station reads out. The
 * digits keep changing, a few at a time; an underline walks the groups in the
 * order a voice would read them. Most of the page is dim. The groups that are
 * lit make a skull, then a ghost, then a pumpkin, each wiped in from the top,
 * and the figures that fall in its eyes are blood red.
 *
 * Canvas 2D, text only. Every digit is a pure function of its cell and the
 * clock, so a frozen clock (?t=) draws the same page. The marks are Net Works'
 * own (marks.js): Nullskull, Haunt, Emberjack.
 * Query string, for looking at the page in a browser:
 *   ?theme=light   ?speed=100   ?mark=0   ?corner=YOUR+TEXT   ?t=6
 */
(function () {
  var RED = '#CC0000', ORDER = ['skull', 'ghost', 'pumpkin'];
  var GROUPS = 12, HOLD = 16, WIPE = 2.4, READ = 2.4;

  function hash(a, b) {
    var h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) | 0;
    h = Math.imul(h ^ h >>> 13, 1274126177);
    return ((h ^ h >>> 16) >>> 0) / 4294967296;
  }
  var imgs = ORDER.map(function (k) {
    var im = new Image();
    im.ready = new Promise(function (ok) { im.onload = ok; im.onerror = ok; });
    im.src = NW_MARKS.maps[k];
    return im;
  });

  var fs, adv, lh, cols, rows, x0, y0, box, masks = [];
  /* each mark on the grid of character cells: 1 = its fill, 2 = a feature cut into it */
  function buildMasks() {
    masks = imgs.map(function (im) {
      var c = document.createElement('canvas'); c.width = cols; c.height = rows;
      var g = c.getContext('2d', { willReadFrequently: true }), out = new Uint8Array(cols * rows);
      if (!im.naturalWidth) return out;
      var s = Math.min(cols * adv * 0.9 / im.naturalWidth, rows * lh * 0.9 / im.naturalHeight);
      var dw = im.naturalWidth * s / adv, dh = im.naturalHeight * s / lh;
      g.imageSmoothingQuality = 'high'; g.drawImage(im, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
      var d = g.getImageData(0, 0, cols, rows).data;
      for (var i = 0; i < out.length; i++) out[i] = d[i * 4] > 127 ? 1 : d[i * 4 + 1] > 127 ? 2 : 0;
      return out;
    });
  }
  function inkA(a) { var c = S.T.ink; return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function text(ctx, s, x, y, size, color, align) {
    ctx.font = '400 ' + size + 'px "DM Mono", ui-monospace, monospace';
    var track = size * 0.16, wd = -track, n;
    for (n = 0; n < s.length; n++) wd += ctx.measureText(s[n]).width + track;
    if (align === 'right') x -= wd;
    ctx.fillStyle = color;
    for (n = 0; n < s.length; n++) { ctx.fillText(s[n], x, y); x += ctx.measureText(s[n]).width + track; }
  }

  var S = NWLive.stage({
    fps: 12,
    ready: Promise.all(imgs.map(function (im) { return im.ready; })).then(function () { if (cols) buildMasks(); }),
    layout: function (S) {
      cols = GROUPS * 6 - 1;
      adv = Math.max(6, Math.floor(Math.min(S.W * 0.60, S.H * 1.25) / cols));
      fs = Math.round(adv / 0.6); lh = Math.round(fs * 1.45);
      rows = Math.max(6, Math.floor(S.H * 0.56 / lh));
      x0 = Math.round(S.cx - cols * adv / 2); y0 = Math.round(S.cy - rows * lh / 2);
      box = S.place(cv, x0 - adv * 2, y0 - lh * 3, x0 + cols * adv + adv * 2, y0 + rows * lh + lh * 3);
      buildMasks();
    },
    draw: function (S, clock) {
      var ctx = S.context(cv, box), INK = S.ink(), DIM = inkA(0.2), r, c;
      ctx.textBaseline = 'alphabetic';
      var font = '400 ' + fs + 'px "DM Mono", ui-monospace, monospace';
      var reading = Math.floor(clock * READ) % (rows * GROUPS);
      /* three passes, one per colour, so the fill style is set three times a frame and not per digit */
      for (var pass = 0; pass < 3; pass++) {
        ctx.font = font; ctx.fillStyle = pass === 0 ? DIM : pass === 1 ? INK : RED;
        for (r = 0; r < rows; r++) {
          var which = Math.floor((clock - r * WIPE / rows) / HOLD), mask = masks[((which % 3) + 3) % 3];
          var y = y0 + (r + 1) * lh - Math.round(lh * 0.28);
          for (c = 0; c < cols; c++) {
            if (c % 6 === 5) continue;
            var m = mask ? mask[r * cols + c] : 0;
            if (m !== pass) continue;
            var cell = r * 131 + c, every = 3 + 5 * hash(cell, 7);
            var digit = Math.floor(hash(cell * 977 + 13, Math.floor(clock / every + hash(cell, 3))) * 10);
            ctx.fillText(String(digit), x0 + c * adv, y);
          }
        }
      }
      /* the group being read */
      var rr = Math.floor(reading / GROUPS), rg = reading % GROUPS;
      ctx.fillStyle = INK;
      ctx.fillRect(x0 + rg * 6 * adv, y0 + (rr + 1) * lh - Math.round(lh * 0.16), 5 * adv - Math.round(adv * 0.25), Math.max(2, Math.round(fs * 0.1)));

      var small = Math.max(9, Math.round(fs * 0.86)), dim = inkA(0.78), xr = x0 + cols * adv;
      text(ctx, '6.660 MHz  AM', x0, y0 - Math.round(lh * 0.7), small, dim, 'left');
      text(ctx, '31 OCT  0000Z', xr, y0 - Math.round(lh * 0.7), small, dim, 'right');
      text(ctx, 'GROUP ' + ('00' + (reading + 1)).slice(-3) + ' OF ' + (rows * GROUPS), x0, y0 + rows * lh + Math.round(lh * 1.3), small, dim, 'left');
      text(ctx, 'END  000 000', xr, y0 + rows * lh + Math.round(lh * 1.3), small, dim, 'right');
    }
  });
  var cv = S.canvas();
  S.start();
})();
</script>
</body>
</html>
