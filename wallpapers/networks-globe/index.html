<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Net Works Globe</title>
<style>html{background:#0a0a0a}</style>
</head>
<body>
<script src="nwlive.js"></script>
<script>
/* Net // Works globe, spinning, as a desktop wallpaper.
 * Copyright (c) 2026 Net Works Lab LLC. All rights reserved. See LICENSE.txt.
 *
 * This is the Net Works still wallpaper set in motion: same layout, same
 * palette, same land mask, same 2x2 supersample, same differenced 15-degree
 * graticule, same two orbit rings and the same wordmark. The globe turns east
 * and the ring nodes travel and breathe, all on one clock that the Speed
 * setting slows down; Speed 100 is the pace of the globe on the Net Works
 * site, one turn in 14 seconds.
 *
 * How it is drawn, given that it redraws every frame for as long as the
 * desktop is up:
 *   - the globe body is raycast in a WebGL2 fragment shader rather than a
 *     JavaScript loop, and the graticule is drawn in the same shader, so the
 *     per-pixel work is the GPU's,
 *   - the page is small stacked canvases - the two corners of the wordmark,
 *     drawn once, then the globe and the limb/rings/nodes - over a plain CSS
 *     background, so a frame repaints the globe's box and nothing else.
 * The continent outlines below are the hand-drawn low-polygon world the stills
 * use; if a coast is ever redrawn there, paste it here too.
 *
 * nwlive.js is the kit every wallpaper in this collection shares: settings,
 * layout, wordmark, clock, the shader pieces. Query string, for looking at the
 * page in a browser:
 *   ?theme=light   ?speed=100   ?orbits=0   ?mark=0   ?corner=YOUR+TEXT
 *   ?t=12.5        freeze the clock at that many seconds
 *   ?still         freeze on the still wallpaper's pose, to compare the two
 */
(function () {
  var D = NWLive.D, G = NWLive.GLSL;

  /* The site globe's own numbers. PHI0 is the still wallpaper's pose, so the two start alike. */
  var SPIN = 0.45, TILT = -0.30, PHI0 = 25 * D;

  /* ---- land mask ------------------------------------------------------- */
  var MW = 4096, MH = 2048;
  var mask = NWLive.raster(MW, MH, function (mc, X, Y) {
    function poly(pts) {
      mc.beginPath();
      for (var i = 0; i < pts.length; i++) {
        if (i === 0) mc.moveTo(X(pts[i][0]), Y(pts[i][1])); else mc.lineTo(X(pts[i][0]), Y(pts[i][1]));
      }
      mc.closePath(); mc.fill();
    }
    mc.fillRect(0, Y(-70), MW, MH);
    var NA=[[-156,71],[-166,68.5],[-165,66],[-168,65.5],[-162,60],[-152,58],[-148,60],[-136,58],[-130,54],[-124,48],[-124,40],[-121,35],[-117,33],[-112,29],[-112,26],[-106,23],[-105,20],[-101,17],[-94,16],[-92,15],[-88,16],[-84,10],[-83,9],[-78,8],[-77,9],[-83,15],[-88,21],[-90,21],[-95,19],[-97,22],[-97,26],[-94,29],[-89,29],[-85,30],[-82,28],[-81,25],[-80,27],[-81,31],[-76,35],[-75,38],[-71,41],[-70,43],[-67,45],[-60,47],[-64,49],[-66,52],[-78,53],[-79,58],[-72,60],[-64,60],[-78,63],[-95,62],[-90,68],[-105,68],[-115,70],[-125,70],[-133,69],[-141,70]];
    var GR=[[-43,60],[-50,64],[-53,68],[-56,72],[-58,76],[-45,80],[-30,83],[-18,80],[-22,76],[-30,70],[-38,66],[-42,61]];
    var SA=[[-78,8],[-72,11],[-64,11],[-60,8],[-50,4],[-51,0],[-48,-1],[-44,-2],[-38,-5],[-35,-8],[-39,-13],[-39,-18],[-41,-22],[-48,-25],[-48,-28],[-54,-34],[-57,-38],[-62,-40],[-65,-43],[-65,-48],[-69,-52],[-66,-55],[-71,-54],[-73,-50],[-74,-44],[-73,-37],[-71,-30],[-70,-23],[-71,-18],[-77,-12],[-81,-5],[-80,-2],[-81,2]];
    var AF=[[-6,36],[-10,30],[-13,28],[-17,21],[-17,15],[-16,12],[-11,7],[-8,5],[-2,5],[3,6],[8,4],[9,2],[10,-1],[13,-6],[12,-12],[13,-17],[15,-23],[17,-29],[20,-35],[26,-34],[31,-30],[33,-26],[35,-22],[40,-16],[41,-11],[40,-5],[41,-2],[43,2],[46,5],[48,8],[51,12],[49,11],[44,10],[43,11],[44,12],[41,15],[40,12],[38,16],[37,19],[35,23],[34,28],[32,31],[28,31],[22,32],[18,30],[12,33],[10,37],[5,37],[0,36],[-2,36]];
    var ARAB=[[34,28],[36,29],[39,21],[43,13],[48,14],[52,16],[57,22],[60,25],[57,25],[50,28],[48,30],[42,30],[40,28],[36,28]];
    var EU=[[-9,43],[-9,37],[-6,36],[-1,36],[0,40],[3,42],[3,44],[-2,44],[-2,48],[1,51],[7,53],[8,57],[6,58],[10,59],[6,61],[8,64],[14,67],[20,70],[26,71],[30,69],[27,65],[22,63],[20,60],[26,60],[30,60],[28,56],[22,56],[20,54],[14,54],[12,52],[16,50],[24,50],[30,52],[35,48],[40,44],[28,41],[20,42],[13,44],[8,44],[3,43],[-2,40],[-6,38]];
    var ITALY=[[7,44],[10,44],[12,42],[15,40],[18,40],[16,41],[14,42],[12,44],[10,46]];
    var ASIA=[[48,30],[50,37],[53,37],[54,30],[57,25],[61,25],[67,24],[68,23],[70,21],[73,16],[74,12],[77,8],[80,10],[80,13],[83,16],[87,21],[89,22],[92,21],[94,18],[97,16],[98,10],[99,6],[100,3],[104,1],[103,8],[106,10],[109,11],[108,16],[106,18],[108,21],[110,21],[113,22],[117,23],[120,25],[121,30],[121,34],[120,37],[122,40],[125,40],[126,38],[129,35],[129,38],[128,41],[130,43],[135,44],[140,46],[142,46],[143,49],[140,53],[143,59],[155,59],[160,60],[164,60],[170,62],[177,64],[180,66],[180,68],[172,66],[168,70],[160,70],[152,72],[140,73],[130,74],[113,74],[105,77],[95,76],[90,75],[80,73],[73,72],[68,68],[60,68],[55,68],[58,60],[55,55],[52,50],[50,45],[48,42],[48,37]];
    var AU=[[114,-22],[113,-26],[115,-31],[118,-35],[123,-34],[129,-32],[135,-35],[138,-35],[140,-38],[147,-38],[150,-37],[153,-32],[153,-28],[153,-25],[146,-19],[145,-15],[142,-11],[140,-17],[137,-12],[136,-15],[133,-12],[130,-12],[127,-14],[122,-18]];
    var TAS=[[145,-41],[148,-41],[148,-43],[146,-43]];
    var NZN=[[173,-35],[176,-38],[178,-38],[175,-41],[174,-41],[173,-37]];
    var NZS=[[167,-44],[171,-43],[174,-42],[173,-46],[168,-47],[166,-45]];
    var JP=[[130,31],[132,33],[135,34],[137,35],[140,36],[141,38],[142,40],[140,42],[141,43],[144,44],[143,42],[140,40],[138,37],[136,35],[133,34],[131,33],[129,32]];
    var PHIL=[[120,18],[122,17],[124,13],[126,10],[126,7],[124,6],[122,9],[120,13]];
    var SUMA=[[95,5],[98,2],[100,0],[102,-2],[104,-4],[106,-6],[105,-6],[101,-2],[98,1]];
    var JAVA=[[105,-6],[108,-7],[112,-8],[114,-8],[112,-8],[108,-8]];
    var BORN=[[109,2],[113,3],[117,4],[119,1],[117,-3],[114,-4],[110,-3],[109,0]];
    var SULA=[[120,1],[123,1],[125,-2],[122,-5],[120,-2],[119,0]];
    var PNG=[[131,-1],[135,-2],[140,-3],[144,-4],[147,-6],[150,-9],[146,-8],[141,-8],[137,-7],[133,-4]];
    var MAD=[[49,-12],[50,-16],[48,-22],[45,-25],[44,-22],[46,-16],[48,-13]];
    var LKA=[[80,9],[82,8],[82,6],[80,6],[79,8]];
    var ICE=[[-22,64],[-18,66],[-14,65],[-15,64],[-19,63]];
    var GB=[[-5,50],[-3,51],[0,51],[1,53],[-1,54],[-2,56],[-5,58],[-6,57],[-5,55],[-5,53]];
    var IRE=[[-10,52],[-6,52],[-6,55],[-8,55],[-10,54]];
    [NA,GR,SA,AF,ARAB,EU,ITALY,ASIA,AU,TAS,NZN,NZS,JP,PHIL,SUMA,JAVA,BORN,SULA,PNG,MAD,LKA,ICE,GB,IRE].forEach(poly);
  });

  /* ---- globe body and graticule, in a fragment shader ------------------- */
  /* Per pixel: the still's four subsamples at +-0.25 px, each raycast onto the
     tilted sphere and looked up in the land mask with the same truncation, so
     coast and limb antialias exactly as they do in the still. The graticule is
     the still's difference stroke: a pixel inside the stroke width inverts -
     twice where a parallel crosses a meridian, as two overlapping difference
     strokes do. */
  var FRAG = G.head + [
    'uniform sampler2D u_mask;',
    'uniform vec3 u_ink;',
    'uniform vec3 u_sea;',
    'uniform float u_lw;',    /* graticule stroke width, px */
    ''
  ].join('\n') + G.lonlat + G.mask + G.graticule + [
    'void main(){',
    '  vec2 p=(gl_FragCoord.xy-u_c)/u_R;',
    '  float inside=0.0,onLand=0.0;',
    '  for(int sy=0;sy<2;sy++)for(int sx=0;sx<2;sx++){',
    '    vec2 P=p+(vec2(float(sx),float(sy))-0.5)*0.5/u_R;',
    '    if(dot(P,P)>1.0)continue;',
    '    inside+=1.0; onLand+=nwMask(u_mask,nwLonLat(P).xy);',
    '  }',
    '  if(inside==0.0){o=vec4(0.0);return;}',
    '  vec3 c=mix(u_sea,u_ink,onLand/inside);',
    '  vec2 g=nwGraticule(p,u_lw);',
    '  c=mix(c,1.0-c,g.x);',
    '  c=mix(c,1.0-c,g.y);',
    '  float a=inside/4.0;',
    '  o=vec4(c*a,a);',
    '}'
  ].join('\n');

  var gb, ob;
  var S = NWLive.stage({
    settings: { orbits: true },
    layout: function (S) {
      /* The globe canvas is the disc plus a pixel of slack; the overlay is the
         box the outer ring and its nodes can reach. */
      gb = S.place(globe, S.cx - S.R - 1, S.cy - S.R - 1, S.cx + S.R + 1, S.cy + S.R + 1);
      ob = S.ringBox(over);
    },
    draw: function (S, clock) {
      if (P.live) {
        P.sphere(gb, PHI0 + SPIN * clock, TILT);
        P.rgb('u_ink', S.T.ink); P.rgb('u_sea', S.T.sea);
        P.gl.uniform1f(P.u('u_lw'), Math.max(1, 2 * S.R * 0.0034));
        P.draw(gb);
      }
      S.drawRings(S.context(over, ob), clock, { rings: S.cfg.orbits });
    }
  });
  var globe = S.canvas(), over = S.canvas();
  var P = S.program(globe, FRAG, function (gl, P) { P.bitmap(0, mask); gl.uniform1i(P.u('u_mask'), 0); });
  S.start();
})();
</script>
</body>
</html>
