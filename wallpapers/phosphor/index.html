<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Net Works Phosphor</title>
<style>html{background:#0a0a0a}</style>
</head>
<body>
<script src="nwlive.js"></script>
<script src="marks.js"></script>
<script>
/* Phosphor: an oscilloscope in XY mode, drawing things it should not, as a
 * desktop wallpaper.
 * Copyright (c) 2026 Net Works Lab LLC. All rights reserved. See LICENSE.txt.
 *
 * Feed a scope one signal on X and another on Y and the beam draws a picture.
 * Here the picture is a ghost, then a skull, a bat and a pumpkin: the beam
 * runs round the outline with a tail of afterglow behind it, the whole figure
 * stays faintly lit the way a slow phosphor would hold it, and every twelve
 * seconds the signals drift and the trace pulls itself into the next shape.
 * The two strips underneath are the signals themselves, X and Y against time,
 * with a red marker where the beam is.
 *
 * Canvas 2D. Each figure is the same number of points (marks.js, traced from
 * Net Works' own marks), so one shape turns into the next point for point.
 * Query string, for looking at the page in a browser:
 *   ?theme=light   ?speed=100   ?mark=0   ?corner=YOUR+TEXT   ?t=1.3
 */
(function () {
  var RED = '#CC0000', ORDER = ['ghost', 'skull', 'bat', 'pumpkin'];
  var HOLD = 12, MORPH = 1.6, CYCLE = 2.6, TAIL = 0.45, CHUNKS = 14;

  var F = ORDER.map(function (k) { return NW_MARKS.paths[k]; });
  var N = F[0].x.length;
  /* which loop each point belongs to, per figure, so the beam can lift between loops */
  F.forEach(function (f) {
    f.of = new Int16Array(N); f.feat = new Uint8Array(N);
    f.loops.forEach(function (l, n) { for (var i = l[0]; i < l[1]; i++) { f.of[i] = n; f.feat[i] = l[2]; } });
  });
  function hash(a, b) {
    var h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) | 0;
    h = Math.imul(h ^ h >>> 13, 1274126177);
    return ((h ^ h >>> 16) >>> 0) / 4294967296;
  }
  function inkA(a) { var c = S.T.ink; return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function text(ctx, s, x, y, size, color, align) {
    ctx.font = '400 ' + size + 'px "DM Mono", ui-monospace, monospace'; ctx.textBaseline = 'alphabetic';
    var track = size * 0.16, wd = -track, n;
    for (n = 0; n < s.length; n++) wd += ctx.measureText(s[n]).width + track;
    if (align === 'right') x -= wd;
    ctx.fillStyle = color;
    for (n = 0; n < s.length; n++) { ctx.fillText(s[n], x, y); x += ctx.measureText(s[n]).width + track; }
  }

  var sx, sy, sw, sh, ty, th, gbox, lbox, X = new Float32Array(N), Y = new Float32Array(N);

  function drawScope() {
    var ctx = S.context(grat, gbox), n, lw = Math.max(1, sw / 620), fs = Math.max(9, Math.round(sw * 0.021));
    ctx.lineWidth = lw; ctx.strokeStyle = inkA(0.16); ctx.beginPath();
    for (n = 1; n < 10; n++) { ctx.moveTo(sx + sw * n / 10, sy); ctx.lineTo(sx + sw * n / 10, sy + sh); }
    for (n = 1; n < 8; n++) { ctx.moveTo(sx, sy + sh * n / 8); ctx.lineTo(sx + sw, sy + sh * n / 8); }
    ctx.stroke();
    ctx.strokeStyle = inkA(0.4); ctx.beginPath();
    ctx.moveTo(sx + sw / 2, sy); ctx.lineTo(sx + sw / 2, sy + sh); ctx.moveTo(sx, sy + sh / 2); ctx.lineTo(sx + sw, sy + sh / 2);
    for (n = 1; n < 50; n++) {
      var tx = sx + sw * n / 50, tk = sh * 0.008; ctx.moveTo(tx, sy + sh / 2 - tk); ctx.lineTo(tx, sy + sh / 2 + tk);
    }
    for (n = 1; n < 40; n++) {
      var tyk = sy + sh * n / 40, tkx = sh * 0.008; ctx.moveTo(sx + sw / 2 - tkx, tyk); ctx.lineTo(sx + sw / 2 + tkx, tyk);
    }
    ctx.stroke();
    ctx.strokeStyle = S.ink(); ctx.lineWidth = Math.max(1.4, sw / 380);
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.lineWidth = lw; ctx.strokeStyle = inkA(0.5);
    ctx.strokeRect(sx, ty, sw * 0.485, th); ctx.strokeRect(sx + sw * 0.515, ty, sw * 0.485, th);
    var dim = inkA(0.78);
    text(ctx, 'XY', sx, sy - fs * 0.9, fs, dim, 'left');
    text(ctx, '500 mV/DIV', sx + sw * 0.16, sy - fs * 0.9, fs, dim, 'left');
    text(ctx, '31 OCT  0000Z', sx + sw, sy - fs * 0.9, fs, dim, 'right');
    text(ctx, 'CH1  X', sx, ty + th + fs * 1.7, fs, dim, 'left');
    text(ctx, 'CH2  Y', sx + sw * 0.515, ty + th + fs * 1.7, fs, dim, 'left');
  }

  var S = NWLive.stage({
    fps: 30,
    layout: function (S) {
      sw = Math.round(Math.min(S.W * 0.46, S.H * 0.86)); sh = Math.round(sw * 0.8);
      th = Math.round(sh * 0.15);
      var gap = Math.round(sh * 0.07), tall = sh + gap + th;
      sx = Math.round(S.cx - sw / 2); sy = Math.round(S.cy - tall / 2); ty = sy + sh + gap;
      var pad = Math.round(sw * 0.08) + 8;
      gbox = S.place(grat, sx - pad, sy - pad, sx + sw + pad, ty + th + pad);
      lbox = S.place(live, sx - pad, sy - pad, sx + sw + pad, ty + th + pad);
      drawScope();
    },
    change: function () { drawScope(); },
    draw: function (S, clock) {
      var ctx = S.context(live, lbox), k = Math.floor(clock / HOLD), f = clock - k * HOLD;
      var A = F[((k % F.length) + F.length) % F.length], B = F[(((k + 1) % F.length) + F.length) % F.length];
      var m = f > HOLD - MORPH ? (f - (HOLD - MORPH)) / MORPH : 0; m = m * m * (3 - 2 * m);
      var shape = m < 0.5 ? A : B, i;
      /* the signals drift a little: the figure leans and breathes, and each point shivers */
      var lean = 0.05 * Math.sin(clock * 0.7), ca = Math.cos(lean), sa = Math.sin(lean), tick = Math.floor(clock * 30);
      var scale = sh * 0.37, ox = sx + sw / 2, oy = sy + sh / 2, squash = 1 + 0.03 * Math.sin(clock * 1.3);
      var noise = 0.004 + 0.05 * Math.sin(Math.PI * m) * Math.sin(Math.PI * m);
      for (i = 0; i < N; i++) {
        var px = A.x[i] + (B.x[i] - A.x[i]) * m + (hash(i, tick) - 0.5) * noise;
        var py = (A.y[i] + (B.y[i] - A.y[i]) * m) * squash + (hash(i + 7919, tick) - 0.5) * noise;
        X[i] = px * ca - py * sa; Y[i] = px * sa + py * ca;
      }
      function at(i) { return [ox + X[i] * scale, oy + Y[i] * scale]; }
      var lw = Math.max(1.4, sw / 330), INK = S.ink();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';

      /* what the phosphor is still holding: every loop, faint */
      shape.loops.forEach(function (l) {
        ctx.beginPath();
        for (i = l[0]; i < l[1]; i++) { var p = at(i); if (i === l[0]) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
        ctx.closePath();
        ctx.lineWidth = lw; ctx.strokeStyle = l[2] ? RED : INK; ctx.globalAlpha = l[2] ? 0.6 : 0.34; ctx.stroke();
      });

      /* the beam and its tail: brightest at the head, lifting where one loop ends and the next begins */
      var head = Math.floor((((clock / CYCLE) % 1) + 1) % 1 * N), tail = Math.floor(N * TAIL), per = Math.ceil(tail / CHUNKS);
      for (var c = 0; c < CHUNKS; c++) {
        ctx.beginPath(); var open = false, last = -1;
        for (var j = c * per; j <= Math.min(tail, (c + 1) * per); j++) {
          var idx = ((head - tail + j) % N + N) % N, loop = shape.of[idx];
          var q = at(idx);
          if (!open || loop !== last || idx === 0) { ctx.moveTo(q[0], q[1]); open = true; } else ctx.lineTo(q[0], q[1]);
          last = loop;
        }
        ctx.globalAlpha = 0.08 + 0.92 * Math.pow((c + 1) / CHUNKS, 1.6);
        ctx.lineWidth = lw * (1 + 0.9 * (c + 1) / CHUNKS); ctx.strokeStyle = INK; ctx.stroke();
      }
      ctx.globalAlpha = 1;
      var h = at(head);
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(h[0], h[1], lw * 2.4, 0, 6.2832); ctx.fill();

      /* the two signals against time */
      function strip(x0, data) {
        var w = sw * 0.485;
        ctx.beginPath();
        for (i = 0; i < N; i++) {
          var x = x0 + w * (i + 0.5) / N, y = ty + th / 2 + data[i] * th * 0.42;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.lineWidth = Math.max(1, lw * 0.8); ctx.strokeStyle = INK; ctx.globalAlpha = 0.85; ctx.stroke();
        ctx.globalAlpha = 1; ctx.strokeStyle = RED; ctx.lineWidth = Math.max(1, lw * 0.8);
        var xm = x0 + w * (head + 0.5) / N;
        ctx.beginPath(); ctx.moveTo(xm, ty); ctx.lineTo(xm, ty + th); ctx.stroke();
      }
      strip(sx, X); strip(sx + sw * 0.515, Y);
    }
  });
  var live = S.canvas(), grat = S.canvas();
  S.start();
})();
</script>
</body>
</html>
