<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Net Works Great Circles</title>
<style>html{background:#0a0a0a}</style>
</head>
<body>
<script src="nwlive.js"></script>
<script src="land-110m.js"></script>
<script>
/* Great-circle arcs, as a desktop wallpaper.
 * Copyright (c) 2026 Net Works Lab LLC. All rights reserved. See LICENSE.txt.
 *
 * Routes, not places. The land is a quiet silhouette of dots and the subject
 * is what runs between the cities: real great circles, lifted off the surface
 * so they arc over the limb, each carrying a pulse that dims as it turns away.
 * The coordinates are real cities; nothing here claims to be traffic.
 *
 * Canvas 2D. Routes and land are unit vectors built once; a frame rotates them
 * and strokes. The pulses run on the wallpaper's one clock, from a fixed seed,
 * so the picture at a given second is always the same picture.
 * Coastlines are Natural Earth 1:110m (land-110m.js).
 * Query string, for looking at the page in a browser:
 *   ?theme=light   ?speed=100   ?mark=0   ?corner=YOUR+TEXT   ?t=12.5
 */
(function () {
  var D = NWLive.D;
  var SPIN = 0.45 / D;         /* degrees a second at Speed 100: one turn in 14 s */
  var LAM0 = -20, PHI = 12;
  var PULSE = 2.5;             /* the pulses keep their own pace when the turn is slowed to the default Speed */
  var STEPS = 96;

  var CITIES = {
    atlanta:    [-84.39, 33.75], oklahoma: [-97.52, 35.47], kansas:  [-94.58, 39.10],
    london:     [-0.13, 51.51],  frankfurt:[8.68, 50.11],   amsterdam:[4.90, 52.37],
    moscow:     [37.62, 55.76],  beijing:  [116.41, 39.90], guangzhou:[113.26, 23.13],
    seoul:      [126.98, 37.57], tokyo:    [139.69, 35.69], singapore:[103.82, 1.35],
    mexico:     [-99.13, 19.43], bogota:   [-74.07, 4.71],  saopaulo:[-46.63, -23.55],
    telaviv:    [34.78, 32.08],  dubai:    [55.27, 25.20],  lagos:   [3.38, 6.52],
    sydney:     [151.21, -33.87], mumbai:  [72.88, 19.08],  tehran:  [51.39, 35.69]
  };
  var ROUTES = [
    ['atlanta','london'], ['atlanta','mexico'], ['atlanta','saopaulo'], ['atlanta','oklahoma'],
    ['oklahoma','kansas'], ['london','frankfurt'], ['frankfurt','moscow'], ['amsterdam','london'],
    ['moscow','beijing'], ['beijing','guangzhou'], ['guangzhou','singapore'], ['seoul','tokyo'],
    ['beijing','seoul'], ['singapore','sydney'], ['singapore','mumbai'], ['mumbai','dubai'],
    ['dubai','telaviv'], ['telaviv','london'], ['lagos','london'], ['mexico','bogota'],
    ['bogota','saopaulo'], ['tehran','moscow'], ['tokyo','atlanta'], ['sydney','tokyo']
  ];

  /* A small seeded generator: the same phases and speeds every time the page loads. */
  var seed = 20261001;
  function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

  /* Spherical interpolation between two lon/lat points: the short way round, in
     equal steps, with a lift that is zero at both ends, highest in the middle
     and scaled by how far the hop is. */
  function greatCircle(a, b) {
    function unit(p) { var lo = p[0] * D, la = p[1] * D; return [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)]; }
    var u = unit(a), v = unit(b);
    var omega = Math.acos(Math.max(-1, Math.min(1, u[0] * v[0] + u[1] * v[1] + u[2] * v[2])));
    var n = STEPS + 1, x = new Float32Array(n), y = new Float32Array(n), z = new Float32Array(n), lift = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var t = i / STEPS;
      var s1 = omega < 1e-8 ? 1 - t : Math.sin((1 - t) * omega) / Math.sin(omega);
      var s2 = omega < 1e-8 ? t : Math.sin(t * omega) / Math.sin(omega);
      var px = u[0] * s1 + v[0] * s2, py = u[1] * s1 + v[1] * s2, pz = u[2] * s1 + v[2] * s2, len = Math.hypot(px, py, pz);
      x[i] = px / len; y[i] = py / len; z[i] = pz / len;
      lift[i] = 1 + Math.sin(t * Math.PI) * (0.06 + omega * 0.10);
    }
    return { n: n, x: x, y: y, z: z, lift: lift };
  }
  var paths = ROUTES.map(function (r) {
    var p = greatCircle(CITIES[r[0]], CITIES[r[1]]);
    p.phase = rnd(); p.speed = 0.10 + rnd() * 0.13;
    p.sx = new Float32Array(p.n); p.sy = new Float32Array(p.n); p.sz = new Float32Array(p.n);
    return p;
  });
  var ends = NWLive.vectors(Object.keys(CITIES).map(function (k) { return CITIES[k]; }));

  /* a coarse land lattice - the silhouette is background here, not the subject */
  var m = NWLive.land(1024, 512);
  var L = NWLive.vectors(NWLive.lattice(2.6).filter(function (p) { return m.at(p[0], p[1]); }));
  var BANDS = 4;

  var box;
  var S = NWLive.stage({
    size: 0.31, fps: 30,
    layout: function (S) { var e = S.R * 1.42 + 8; box = S.place(cv, S.cx - e, S.cy - e, S.cx + e, S.cy + e); },
    draw: function (S, clock) {
      var ctx = S.context(cv, box), R = S.R, cx = S.cx, cy = S.cy, INK = S.ink();
      var w = NWLive.view(LAM0 - SPIN * clock, PHI), i, k, X, depth, u = R / 330;

      ctx.strokeStyle = S.T.rule; ctx.lineWidth = Math.max(1, u);
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();

      /* land silhouette, deliberately quiet */
      ctx.fillStyle = S.T.grey;
      var dot = Math.max(1.1, 1.25 * u);
      for (k = 0; k < BANDS; k++) {
        ctx.globalAlpha = 0.28 + 0.36 * (k + 0.5) / BANDS;
        ctx.beginPath();
        for (i = 0; i < L.n; i++) {
          X = L.x[i] * w.a + L.y[i] * w.b; depth = w.sp * L.z[i] + w.cp * X;
          if (depth <= 0 || (depth >= 1 ? BANDS - 1 : (depth * BANDS) | 0) !== k) continue;
          var lx = cx + (-L.x[i] * w.b + L.y[i] * w.a) * R, ly = cy - (w.cp * L.z[i] - w.sp * X) * R;
          ctx.moveTo(lx + dot, ly); ctx.arc(lx, ly, dot, 0, 6.2832);
        }
        ctx.fill();
      }

      /* the arcs. Radius grows with the lift, so the line leaves the surface and comes back. */
      ctx.lineWidth = Math.max(1, 1.1 * u); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = INK; ctx.fillStyle = INK;
      for (var r = 0; r < paths.length; r++) {
        var p = paths[r], open = false, sum = 0, cnt = 0;
        ctx.beginPath();
        for (i = 0; i < p.n; i++) {
          X = p.x[i] * w.a + p.y[i] * w.b; depth = w.sp * p.z[i] + w.cp * X;
          p.sz[i] = depth;
          if (depth <= 0) { open = false; continue; }
          p.sx[i] = cx + (-p.x[i] * w.b + p.y[i] * w.a) * R * p.lift[i];
          p.sy[i] = cy - (w.cp * p.z[i] - w.sp * X) * R * p.lift[i];
          sum += depth; cnt++;
          if (open) ctx.lineTo(p.sx[i], p.sy[i]); else { ctx.moveTo(p.sx[i], p.sy[i]); open = true; }
        }
        if (!cnt) continue;
        ctx.globalAlpha = 0.22 + 0.6 * (sum / cnt);
        ctx.stroke();

        /* the pulse: one travelling dot per route, brightest when it faces the viewer */
        var pos = (p.phase + clock * PULSE * p.speed) % 1, idx = Math.round(pos * (p.n - 1));
        if (p.sz[idx] > 0) {
          ctx.globalAlpha = 0.25 + 0.75 * p.sz[idx];
          ctx.beginPath(); ctx.arc(p.sx[idx], p.sy[idx], (2.1 + 1.2 * p.sz[idx]) * u, 0, 6.2832); ctx.fill();
        }
      }

      /* the endpoints themselves */
      for (i = 0; i < ends.n; i++) {
        X = ends.x[i] * w.a + ends.y[i] * w.b; depth = w.sp * ends.z[i] + w.cp * X;
        if (depth <= 0) continue;
        ctx.globalAlpha = 0.3 + 0.7 * depth;
        ctx.beginPath(); ctx.arc(cx + (-ends.x[i] * w.b + ends.y[i] * w.a) * R, cy - (w.cp * ends.z[i] - w.sp * X) * R, 1.9 * u, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  });
  var cv = S.canvas();
  S.start();
})();
</script>
</body>
</html>
